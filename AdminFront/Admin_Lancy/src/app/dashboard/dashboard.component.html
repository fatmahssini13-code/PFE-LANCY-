
<div class="sidebar">

  <h2 class="logo">LANCY</h2>
  <p class="subtitle">Admin Panel</p>

  <nav>

    <a routerLink="/dashboard" routerLinkActive="active">🏠 Dashboard</a>
    <a routerLink="/projects" routerLinkActive="active">💼 Projects</a>
    <a routerLink="/escrow" routerLinkActive="active">🔒 Escrow</a>
    <a routerLink="/disputes" routerLinkActive="active">⚖️ Disputes</a>
    <a routerLink="/users" routerLinkActive="active">👤 Users</a>

  </nav>

</div>


<div class="dashboard">

  <!-- CARDS -->
<div class="header-actions">
  <button (click)="toggleDarkMode()" class="btn-theme">
    <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
    {{ isDarkMode ? 'Mode Clair' : 'Mode Sombre' }}
  </button>
</div>
  <div class="cards">

    <div class="card blue">
      <h3>Total Users</h3>
      <p>{{ stats.users.total }}</p>
    </div>

    <div class="card purple">
      <h3>Clients</h3>
      <p>{{ stats.users.clients }}</p>
    </div>

    <div class="card cyan">
      <h3>Freelancers</h3>
      <p>{{ stats.users.freelancers }}</p>
    </div>

    <div class="card orange">
      <h3>Escrow Total</h3>
      <p>{{ stats.escrow.total }} DT</p>
    </div>

  </div>

  <!-- BAR CHART -->

  <div class="chart-card">

    <h2>📊 Analyse des projets</h2>

    <canvas #projectsChart></canvas>

  </div>

  <!-- PIE CHART -->

  <div class="chart-card">

    <h2>👥 Répartition des utilisateurs</h2>

    <canvas #usersChart></canvas>

  </div>

</div>

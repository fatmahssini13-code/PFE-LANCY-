<!-- users.component.html -->
<div class="container">

  <h2>👥 Gestion des utilisateurs</h2>

  <div *ngIf="loading" class="spinner-wrap">
    <div class="spinner"></div>
  </div>

  <p *ngIf="error" class="error-text">{{ error }}</p>

  <div class="table-card" *ngIf="!loading && !error">

    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of users">

          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>

          <td>
            <span [ngClass]="{
              'badge-client':     user.role === 'client',
              'badge-freelancer': user.role === 'freelancer',
              'badge-admin':      user.role === 'admin'
            }">
              {{ user.role | titlecase }}
            </span>
          </td>

          <td>
            <span [class]="user.isBlocked ? 'badge-blocked' : 'badge-active'">
              {{ user.isBlocked ? 'Bloqué' : 'Actif' }}
            </span>
          </td>

          <!-- Actions dans UNE SEULE colonne <td> -->
          <td class="actions">
            <button class="btn-block" (click)="toggleBlock(user._id)">
              {{ user.isBlocked ? '✅ Débloquer' : '🚫 Bloquer' }}
            </button>
            <button class="btn-delete" (click)="deleteUser(user._id)">
              🗑️ Supprimer
            </button>
          </td>

        </tr>

        <tr *ngIf="users.length === 0">
          <td colspan="5" class="empty-row">Aucun utilisateur trouvé.</td>
        </tr>
      </tbody>
    </table>

  </div>
</div>
